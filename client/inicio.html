<style>
/* Inicio ISL: departamentos de la persona. Diseño de referencia: design/isl/propuesta_capa_isl.html */
:root{--cream:#efeee8;--grid:#dedcd3;--paper:#f6f5f0;--navy:#01193c;--ink:#01193c;--ink2:#4b5568;--red:#e0546e;--line:#c9c6bc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#0d1526;--grid:#16213a;--paper:#121c31;--ink:#eceae2;--ink2:#9aa3b5;--line:#2a3654}}
:root[data-theme="dark"]{--cream:#0d1526;--grid:#16213a;--paper:#121c31;--ink:#eceae2;--ink2:#9aa3b5;--line:#2a3654}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:13px;line-height:1.55;min-height:100vh;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.wide{font-family:Archivo,"Arial Black",sans-serif;font-style:italic;font-weight:900;font-stretch:125%;text-transform:uppercase;line-height:.92;margin:0}
.mono{text-transform:uppercase;letter-spacing:.04em;font-size:11.5px}
.oval{all:unset;cursor:pointer;position:relative;display:inline-grid;place-items:center;padding:15px 32px;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:inherit;isolation:isolate}
.oval svg{position:absolute;inset:-6px -10px;width:calc(100% + 20px);height:calc(100% + 12px);z-index:-1;overflow:visible}
.oval path{fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-dasharray:420}
.oval:hover path{animation:draw .7s ease}
@keyframes draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
.oval:focus-visible{outline:2px solid currentColor;outline-offset:8px;border-radius:40px}
.oval[disabled]{opacity:.5;cursor:default;pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--cream) 88%,transparent);backdrop-filter:blur(4px);position:sticky;top:0;z-index:10}
.top .logo{width:62px;color:var(--ink)}
.top .logo svg{display:block;width:100%;height:auto}
.top nav{display:flex;align-items:center;gap:22px;color:var(--ink2)}
.top button.link{all:unset;cursor:pointer;color:inherit}
.top button.link:hover{color:var(--ink)}
.top button.link:focus-visible{outline:2px solid currentColor;outline-offset:4px}
.who{display:flex;align-items:center;gap:10px;color:var(--ink)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#f5f78a;font-family:Archivo,sans-serif;font-weight:800;font-style:italic;font-size:12px}
.hero{padding:56px clamp(16px,4vw,48px) 36px;max-width:1280px;margin:0 auto}
.hero .mono{color:var(--ink2);min-height:1.2em}
.hero h1{font-size:clamp(2.6rem,7vw,5.6rem);margin-top:14px}
.hero h1 .brush{display:block;font-family:"Permanent Marker",cursive;font-style:normal;font-weight:400;text-transform:none;color:var(--red);font-size:.62em;margin:.1em 0 0 .25em;transform:rotate(-3deg);transform-origin:left;letter-spacing:0}
.aviso{max-width:1280px;margin:0 auto 22px;padding:0 clamp(16px,4vw,48px)}
.aviso p{margin:0;padding:12px 16px;border-left:3px solid var(--red);background:var(--paper);color:var(--ink)}
.deps{max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,48px) 96px;display:flex;flex-direction:column;gap:22px}
.dep{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);min-height:360px;border:2px solid var(--navy);background:var(--paper)}
.dep .img{position:relative;overflow:hidden;background:var(--navy) center/cover no-repeat}
.dep .img.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(20deg,rgba(0,0,20,.6) 0%,rgba(0,0,20,.22) 34%,transparent 55%)}
.dep .mark{position:absolute;z-index:2;left:28px;bottom:24px;height:46px;width:auto;color:#fff}
.dep .mark svg{display:block;height:100%;width:auto}
.dep .pv{position:absolute;inset:0;width:100%;height:100%}
.dep .txt{padding:28px 32px;display:flex;flex-direction:column;gap:12px}
.dep .txt h2{font-size:clamp(1.6rem,2.8vw,2.3rem);margin:0}
.dep .txt p{margin:0;max-width:46ch;text-transform:uppercase;font-size:12px;letter-spacing:.02em}
.dep .meta{display:flex;gap:26px;margin-top:6px;flex-wrap:wrap}
.dep .meta b{display:block;font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:1.9rem;line-height:1}
.dep .end{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;flex-wrap:wrap}
.dep .txt .err{flex-basis:100%;margin:0;padding:8px 10px;border-left:2px solid currentColor;font-size:12px;text-transform:none;letter-spacing:0}
.state{display:inline-flex;align-items:center;gap:8px}
.state i{width:8px;height:8px;border-radius:50%;background:currentColor}
/* Campus Experience */
.c-campus{border-color:#0f2145}
.c-campus .txt{background:#0f2145;color:#e4e4e4}
.c-campus .txt h2{font-family:Archivo,sans-serif;font-style:italic;font-weight:900;font-stretch:125%;text-transform:uppercase;color:#f3f1ea}
.c-campus .meta b,.c-campus .state{color:#ff8aa5}
.c-campus .oval{color:#f3f1ea}
.c-campus .err{color:#ffb3c2}
/* LaLiga Select */
.c-lls{border-color:#29235c}
.c-lls .txt{background:#fff;color:#00001b}
.c-lls .txt h2{font-family:Archivo,sans-serif;font-style:normal;font-weight:800;font-stretch:80%;text-transform:uppercase;font-size:clamp(2rem,3.6vw,3rem);line-height:.9;color:#ff4b44}
.c-lls .state,.c-lls .oval{color:#ff4b44}
/* Futbol First */
.c-ff{border-color:#29333e}
.c-ff .img{background:#29333e}
.c-ff .txt{background:#e0d3c3;color:#29333e}
.c-ff .txt h2{font-family:Archivo,sans-serif;font-style:normal;font-weight:800;font-size:clamp(1.9rem,3.2vw,2.7rem);letter-spacing:-.02em;line-height:1}
.c-ff .state{color:#009950}
.c-ff .oval{color:#29333e}
.empty{max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,48px) 96px;color:var(--ink2)}
[hidden]{display:none!important}
@media (max-width:820px){.dep{grid-template-columns:1fr}.dep .img{min-height:220px}}
@media (prefers-reduced-motion:reduce){.oval:hover path{animation:none}}
</style>
</head>

  };
  const h=new Date().getHours();$("saludo").textContent=(h<6||h>=21?"Buenas noches,":h<14?"Buenos días,":"Buenas tardes,");
  const av=new URLSearchParams(location.search).get("aviso");
  if(av){$("avisoTx").textContent=av;$("aviso").hidden=false;history.replaceState(null,"",location.pathname)}
  const card=d=>{const I=INFO[d.k]||{title:"<h2>"+esc(d.n)+"</h2>",desc:"",note:""};
    let stats="";
